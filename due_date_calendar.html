
    <html>
    <head>
        <title>Due Date Calendar</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background: #1a1a2e; color: #eee; }
            .container { max-width: 900px; margin: 0 auto; }
            h1 { color: #00d4ff; text-align: center; margin-bottom: 10px; }
            .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
            .date-card { background: #16213e; border-radius: 12px; margin-bottom: 20px; overflow: hidden; border-left: 4px solid #00d4ff; }
            .date-header { background: #0f3460; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
            .date-title { font-size: 1.3em; font-weight: bold; color: #00d4ff; }
            .days-badge { background: #e94560; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.9em; }
            .days-badge.today { background: #ff6b6b; }
            .days-badge.soon { background: #ffa502; }
            .days-badge.later { background: #2ed573; }
            .assignments { padding: 15px 20px; }
            .assignment-row { display: flex; padding: 10px 0; border-bottom: 1px solid #0f3460; }
            .assignment-row:last-child { border-bottom: none; }
            .course-tag { background: #0f3460; color: #00d4ff; padding: 4px 10px; border-radius: 4px; font-size: 0.85em; min-width: 120px; text-align: center; margin-right: 15px; }
            .assignment-name { flex: 1; color: #ddd; }
            .score { color: #888; font-size: 0.9em; }
            .score.zero { color: #e94560; font-weight: bold; }
            .empty-state { text-align: center; padding: 60px; color: #666; }
            .empty-state h2 { color: #2ed573; }
            .summary-bar { background: #16213e; padding: 20px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-around; text-align: center; }
            .stat { }
            .stat-value { font-size: 2em; font-weight: bold; color: #00d4ff; }
            .stat-label { color: #888; font-size: 0.9em; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📅 Due Date Calendar</h1>
            <p class="subtitle">Upcoming assignments by due date • Generated 2026-04-01 06:42</p>
    
            <div class="empty-state">
                <h2>✨ All Clear!</h2>
                <p>No upcoming assignments with future due dates.</p>
                <p style="color: #888; font-size: 0.9em;">This could mean the semester has ended or grades haven't been updated yet.</p>
            </div>
        
        </div>
    </body>
    </html>
